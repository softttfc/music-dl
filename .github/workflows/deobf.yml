name: LX 反混淆

on:
  workflow_dispatch:
    inputs:
      src_file:
        description: '要反混淆的 JS 文件路径'
        required: true
        default: 'input/屿溪-终章.js'
      out_file:
        description: '输出文件路径'
        required: false
        default: 'output/deobf.js'
      use_webcrack:
        description: '是否使用 webcrack 二次还原'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  deobf:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 调试环境
        run: |
          echo "node: $(which node) $(node -v)"
          echo "npm:  $(which npm) $(npm -v)"
          echo "npm prefix: $(npm config get prefix)"
          echo "python: $(which python) $(python -V)"

      - name: 准备输出目录
        run: mkdir -p output

      - name: 步骤1 - 运行时 hook
        run: |
          node sources/lx_deobf/runtime_hook.js \
            "${{ github.event.inputs.src_file }}" \
            output/runtime-dump.json

      - name: 步骤2 - 静态反混淆 + 运行时回填
        run: |
          python sources/lx_deobf/jm.py \
            "${{ github.event.inputs.src_file }}" \
            output/deobf.step1.js \
            output/runtime-dump.json

      - name: 步骤3 - webcrack 二次还原（可选）
        if: ${{ github.event.inputs.use_webcrack == 'true' }}
        run: |
          npx --yes webcrack output/deobf.step1.js -o output/deobf.js || {
            echo "webcrack 失败，使用中间结果"
            cp output/deobf.step1.js output/deobf.js
          }

      - name: 步骤3 - 跳过二次还原
        if: ${{ github.event.inputs.use_webcrack != 'true' }}
        run: |
          cp output/deobf.step1.js output/deobf.js

      - name: 复制到用户指定输出路径
        if: ${{ github.event.inputs.out_file != 'output/deobf.js' }}
        run: |
          mkdir -p "$(dirname "${{ github.event.inputs.out_file }}")"
          cp output/deobf.js "${{ github.event.inputs.out_file }}"

      - name: 显示反混淆摘要
        run: |
          echo "===== 反混淆摘要 ====="
          python - <<'PY'
          import json
          d = json.load(open('output/runtime-dump.json', encoding='utf-8'))
          s = d['summary']
          print(f"字符串: {s['stringCount']}")
          print(f"请求:   {s['requestCount']}")
          print(f"发送:   {s['sendCount']}")
          print(f"事件:   {s['eventCount']}")
          print(f"错误:   {s['errorCount']}")
          print()
          print("===== 请求 URL =====")
          for r in d['requests'][:30]:
              print(r.get('method', 'GET'), r.get('url', ''))
          print()
          print("===== 平台 sources =====")
          for item in d['sends']:
              if item.get('event') == 'inited':
                  srcs = item.get('data', {}).get('sources', {})
                  for k, v in srcs.items():
                      print(f"  {k} -> {v.get('name', '')}")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: deobf-result
          path: |
            output/runtime-dump.json
            output/deobf.step1.js
            output/deobf.js

      - name: 提交回仓库（可选）
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add output/
          git commit -m "chore: deobfuscate ${{ github.event.inputs.src_file }} [skip ci]" || exit 0
          git push
